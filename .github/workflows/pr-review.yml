name: PR Review Pipeline

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [develop]

jobs:
  pr-checks:
    name: PR Quality Checks
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type checking
        run: npx tsc --noEmit

      - name: ESLint check
        run: npm run lint

      - name: Build check
        run: npm run build

      - name: PR size check
        run: |
          echo "Checking PR size..."
          git diff --stat ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }} 